name: One-click repair and build MTForum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtforum-one-click-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

