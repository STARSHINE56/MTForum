          PATCH_B64
          # Stop safely if main was changed since the uploaded source snapshot.
          # Re-running after a completed repair is also safe.
          if git apply --reverse --check /tmp/mtforum-repair.patch 2>/dev/null; then
            echo 'Repair patch already present; no source files changed.'
          elif git apply --check /tmp/mtforum-repair.patch; then
            git apply /tmp/mtforum-repair.patch
          else
            echo 'Source differs from the supplied ZIP. Aborting without overwriting changes.' >&2
            exit 1
          fi

      - name: Verify layouts and regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_main_layout.py
          python3 - <<'PY_CHECK'
          import pathlib, xml.etree.ElementTree as ET
          for file in pathlib.Path('app/src/main/res/layout').glob('*.xml'):
              ET.parse(file)
          print('All layout XML files parsed successfully.')
          PY_CHECK

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK and wrapper
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk/platforms"
          test -f gradlew && test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, and debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" 'output/MT论坛-1.0.0.apk'
          (cd output && sha256sum 'MT论坛-1.0.0.apk' > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-repaired-debug-apk
          path: output/
          if-no-files-found: error

      - name: Commit and push repaired source only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/mtforum-bottom-nav-check.yml \
            app/src/main/java/com/solosu/mtforum/MainActivity.java \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/layout/fragment_community.xml \
            app/src/main/res/layout/fragment_home.xml \
            app/src/main/res/layout/fragment_profile.xml \
            app/src/main/res/layout/item_thread.xml scripts/check_main_layout.py
          if git diff --cached --quiet; then
            echo 'No new changes to push.'
          else
            git commit -m 'fix: repair bottom navigation whitespace and polish layouts'
            git push origin HEAD:main
          fi
