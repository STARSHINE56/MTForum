plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.solosu.mtforum'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solosu.mtforum'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName "2.2"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'mtforum123'
            keyAlias 'mtforum'
            keyPassword 'mtforum123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.squareup.okhttp3:mockwebserver:${libs.versions.okhttp.get()}"
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.jsoup
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.webkit
    implementation libs.androidx.drawerlayout
}

// Anonymous live diagnostics use the same GET headers and OkHttp settings as the app.
// This is not a unit test: remote access failures are recorded rather than hidden.
tasks.register('forumNetworkProbe', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(android.bootClasspath) + files('build/intermediates/javac/debug/compileDebugJavaWithJavac/classes',
            'build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes') + configurations.debugUnitTestRuntimeClasspath
    mainClass = 'com.solosu.mtforum.network.ForumNetworkProbe'
    args layout.buildDirectory.file('reports/forum-network-probe.txt').get().asFile.absolutePath
}

// Keep real image extraction/HTTP evidence separate from the deterministic regression tests.
tasks.register('forumImageProbe', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(android.bootClasspath) + files('build/intermediates/javac/debug/compileDebugJavaWithJavac/classes',
            'build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes') + configurations.debugUnitTestRuntimeClasspath
    mainClass = 'com.solosu.mtforum.network.ForumImageProbe'
    args layout.buildDirectory.file('reports/forum-image-probe.txt').get().asFile.absolutePath
}
