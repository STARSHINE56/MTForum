name: Build MT Forum APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: mtforum-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Lint and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners include Android SDK. Do not invoke
      # setup-android, which failed attempting to install obsolete 'tools'.
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/platforms" ]]; then
            echo 'Android SDK unavailable on this runner.' >&2
            exit 1
          fi
          ls -1 "$sdk/platforms"
          ls -1 "$sdk/build-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo 'Gradle Wrapper missing; use the complete wrapper from the project.' >&2
            exit 1
          fi
          chmod +x gradlew
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Run unit tests, lint and build APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one debug APK, found %s\n' "${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" 'output/MT论坛-1.0.0.apk'
          sha256sum 'output/MT论坛-1.0.0.apk' > 'output/SHA256SUMS.txt'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT论坛-1.0.0
          path: output/
          if-no-files-found: error
          retention-days: 30
