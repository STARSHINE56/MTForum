          python3 /tmp/mtforum_fix_v3.py
      - name: Verify layout and source markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for x in Path('app/src/main/res/layout').glob('*.xml'):
              ET.parse(x)
          layout=Path('app/src/main/res/layout/activity_main.xml').read_text()
          java=Path('app/src/main/java/com/solosu/mtforum/MainActivity.java').read_text()
          assert 'app:layout_constraintBottom_toBottomOf="parent"' in layout
          assert 'app:layout_constraintBottom_toTopOf="@id/bottom_nav_container"' not in layout
          assert 'updatePagerNavInset(show);' in java
          assert 'lp.bottomMargin = 0;' in java
          assert 'pager.setPadding(' in java
          print('Static source and XML checks passed')
          PYTEST
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests lint and debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK before committing
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-bottom-v3-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Commit only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/res/layout/activity_main.xml app/src/main/java/com/solosu/mtforum/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'fix: overlay nav and clear pager bottom inset on hide'
            git push origin HEAD:main
          else
            echo 'Fix already applied'
          fi
