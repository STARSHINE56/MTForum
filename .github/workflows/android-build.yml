name: Build MTForum Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew clean test lint assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 'MT论坛-1.0.0.apk'
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MT论坛-1.0.0
          path: MT论坛-1.0.0.apk
          if-no-files-found: error
