name: Fix MTForum shared bottom blank and build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtforum-shared-bottom-fix
  cancel-in-progress: false

jobs:
  fix-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fix shared ViewPager bottom layout
