          PY_B64
          python3 /tmp/fix_shared_bottom.py

      - name: Confirm changes are limited to shared layout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY_CHECK'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for f in Path('app/src/main/res/layout').glob('*.xml'):
              ET.parse(f)
          x=Path('app/src/main/res/layout/activity_main.xml').read_text()
          j=Path('app/src/main/java/com/solosu/mtforum/MainActivity.java').read_text()
          assert 'app:layout_constraintBottom_toBottomOf="parent"' in x
          assert 'app:layout_constraintBottom_toTopOf="@id/bottom_nav_container"' not in x
          assert 'updatePagerBottomSpace(show);' in j
          print('XML/layout regression checks passed.')
          PY_CHECK

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test lint and compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload generated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-shared-bottom-fix-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit tested source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/res/layout/activity_main.xml app/src/main/java/com/solosu/mtforum/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "fix: release shared pager bottom space when nav hides"
            git push origin HEAD:main
          else
            echo 'Shared fix already present.'
          fi
