name: MTForum Bottom Navigation Check and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mtforum-bottom-nav-check.yml'

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect bottom-navigation spacing
        shell: bash
        run: |
          mkdir -p reports
          {
            echo '# MTForum bottom-navigation spacing inspection'
            echo
            echo 'Inspect these matches to find duplicated bottom padding, margins, translations and system insets.'
            echo 'This step diagnoses; it does not change source code.'
            echo
            echo '## Java navigation and inset logic'
            grep -RInE 'setBottomNavVisible|translationY|setVisibility|WindowInsets|setOnApplyWindowInsetsListener|setPadding\(' app/src/main/java/ 2>/dev/null || true
            echo
            echo '## XML padding, navigation and container height'
            grep -RInE 'paddingBottom|layout_marginBottom|fitsSystemWindows|clipToPadding|layout_height|bottomNavigation' app/src/main/res/layout/ 2>/dev/null || true
          } > reports/bottom-nav-inspection.txt
          cat reports/bottom-nav-inspection.txt

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android SDK and Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Test lint and build
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" 'output/MT论坛-1.0.0.apk'
          sha256sum 'output/MT论坛-1.0.0.apk' > output/SHA256SUMS.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-bottom-nav-report
          path: reports/
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT论坛-1.0.0
          path: output/
          if-no-files-found: error
